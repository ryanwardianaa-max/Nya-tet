<!DOCTYPE html>
<html lang="id" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuis PSAT Matematika</title>
  
  <!-- Memuat Tailwind CSS untuk Styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>

  <!-- Memuat React dan ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Memuat Babel untuk menerjemahkan kode JSX di browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    /* Sedikit styling tambahan untuk font matematika */
    .font-serif { font-family: "Times New Roman", Times, serif; }
  </style>
</head>
<body class="bg-slate-50 transition-colors duration-300">
  
  <!-- Wadah utama aplikasi React -->
  <div id="root"></div>

  <!-- Script React kita (harus type="text/babel") -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- Komponen Ikon (Inline SVG) ---
    const SunIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>;
    const MoonIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>;
    const UserIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
    const BookIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>;
    const HashIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/></svg>;
    const CheckCircle = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-green-500"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>;
    const XCircle = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-red-500"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>;

    // --- Komponen Matematika Kustom ---
    const Fraction = ({ num, den }) => (
      <span className="inline-flex flex-col items-center justify-center align-middle mx-2 text-lg">
        <span className="border-b border-current px-2 pb-[1px]">{num}</span>
        <span className="px-2 pt-[1px]">{den}</span>
      </span>
    );
    const Sqrt = ({ children }) => (
      <span className="inline-flex items-center">
        <span className="text-xl leading-none">&radic;</span>
        <span className="border-t border-current pt-[2px] mt-[1px] leading-none">{children}</span>
      </span>
    );
    const Sup = ({ children }) => <sup className="text-sm">{children}</sup>;

    // --- Data Soal ---
    const questionsData = [
      { id: 1, question: <>Tentukan nilai nol dari fungsi <span className="font-serif italic">f(x)</span> = <Fraction num="3x - 6" den="2x + 1" /></>, options: ["2", "-6", "1", "1/2", "3"], answerIndex: 0 },
      { id: 2, question: <>Asimtot tegak dari fungsi <span className="font-serif italic">f(x)</span> = <Fraction num="2x" den={<>x<Sup>2</Sup> + 5x + 4</>} /> adalah ....</>, options: ["x = 2", "x = 2 dan x = 1", "x = -4 dan x = -1", "x = 4 dan x = 1", "x = 1"], answerIndex: 2 },
      { id: 3, question: <>Domain dari fungsi <span className="font-serif italic">g(x)</span> = <Fraction num="x + 1" den={<>x<Sup>2</Sup> - 5x + 6</>} /> adalah ....</>, options: ["x ≠ -2 dan x ≠ -3", "x ≠ 2", "x ≠ 2 dan x ≠ 3", "x ≥ 2", "x ≤ 3"], answerIndex: 2 },
      { id: 4, question: <>Domain dari fungsi <span className="font-serif italic">h(x)</span> = <Fraction num={<Sqrt>x + 5</Sqrt>} den="x - 1" /> adalah ....</>, options: ["x ≥ -5", "x > -5 dan x ≠ 1", "x ≠ 1", "x ≥ -5 dan x ≠ 1", "-5 ≤ x ≤ 1"], answerIndex: 3 },
      { id: 5, question: <>Populasi bakteri dimodelkan oleh <span className="font-serif italic">P(t)</span> = 250 &middot; 2<Sup>t/3</Sup>, dengan <span className="font-serif italic">t</span> dalam jam. Waktu paling awal dalam bilangan jam bulat agar populasi melebihi 2000 bakteri adalah ....</>, options: ["7 jam", "8 jam", "9 jam", "10 jam", "11 jam"], answerIndex: 3 },
      { id: 6, question: <>Tentukan nilai nol dari <span className="font-serif italic">f(x)</span> = <Fraction num={<>x<Sup>2</Sup> - 5x + 6</>} den="2x + 3" /></>, options: ["x = 2 atau x = 3", "x = -2 atau x = 3", "x = -3 atau x = -2", "x ≠ 3", "x ∈ ℝ"], answerIndex: 0 },
      { id: 7, question: <>Domain dari fungsi <span className="font-serif italic">h(x)</span> = <Fraction num={<Sqrt>x + 5</Sqrt>} den="x - 1" /> adalah ....</>, options: ["x ≥ -5", "x > -5 dan x ≠ 1", "x ≠ 1", "x ≥ -5 dan x ≠ 1", "-5 ≤ x ≤ 1"], answerIndex: 3 },
      { id: 8, question: <>Domain dari fungsi <span className="font-serif italic">g(x)</span> = <Fraction num="x + 1" den={<>x<Sup>2</Sup> - 5x + 6</>} /> adalah ....</>, options: ["x ≠ -2 dan x ≠ -3", "x ≠ 2", "x ≠ 2 dan x ≠ 3", "x ≥ 2", "x ≤ 3"], answerIndex: 2 },
      { id: 9, question: <>Populasi bakteri dimodelkan oleh <span className="font-serif italic">P(t)</span> = 250 &middot; 2<Sup>t/3</Sup>, dengan <span className="font-serif italic">t</span> dalam jam. Waktu paling awal dalam bilangan jam bulat agar populasi melebihi 2000 bakteri adalah ....</>, options: ["7 jam", "8 jam", "9 jam", "10 jam", "11 jam"], answerIndex: 3 },
      { id: 10, question: <>Asimtot tegak dari fungsi <span className="font-serif italic">f(x)</span> = <Fraction num="2x" den={<>x<Sup>2</Sup> + 5x + 4</>} /> adalah ....</>, options: ["x = 2", "x = 2 dan x = 1", "x = -4 dan x = -1", "x = 4 dan x = 1", "x = 1"], answerIndex: 2 }
    ];

    // =========================================================================
    // PASTIKAN ANDA MENGGANTI URL DI BAWAH INI DENGAN URL WEB APP GAS ANDA!
    // =========================================================================
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyMWXkamSfJRj4YZi85kz5QLbuzbr1UDJE7xK3Im1ebvSyavunQyN3k9IpLRgkqwXw-/exec"; 

    function App() {
      const [isDarkMode, setIsDarkMode] = useState(false);
      const [gameState, setGameState] = useState('login'); // 'login', 'quiz', 'result'
      const [userData, setUserData] = useState({ name: '', cls: '', absen: '' });
      
      const [currentQuestionIdx, setCurrentQuestionIdx] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [isConfirming, setIsConfirming] = useState(false);
      const [feedback, setFeedback] = useState(null); 
      const [score, setScore] = useState(0);

      useEffect(() => {
        const rootElement = document.documentElement;
        const bodyElement = document.body;
        if (isDarkMode) {
          rootElement.classList.add('dark');
          bodyElement.classList.add('dark:bg-gray-900');
        } else {
          rootElement.classList.remove('dark');
          bodyElement.classList.remove('dark:bg-gray-900');
        }
      }, [isDarkMode]);

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        if (userData.name && userData.cls && userData.absen) {
          setGameState('quiz');
        }
      };

      const handleOptionSelect = (index) => {
        if (feedback) return; 
        setSelectedOption(index);
      };

      const handleConfirm = () => {
        if (selectedOption === null) return;
        
        setIsConfirming(true);
        const isCorrect = selectedOption === questionsData[currentQuestionIdx].answerIndex;
        const newScore = isCorrect ? score + 1 : score;
        
        setFeedback(isCorrect ? 'correct' : 'wrong');
        if (isCorrect) setScore(prev => prev + 1);

        setTimeout(() => {
          setFeedback(null);
          setSelectedOption(null);
          setIsConfirming(false);
          
          if (currentQuestionIdx < questionsData.length - 1) {
            setCurrentQuestionIdx(prev => prev + 1);
          } else {
            const finalScorePercentage = Math.round((newScore / questionsData.length) * 100);
            const payloadData = {
              nama: userData.name,
              kelas: userData.cls,
              absen: userData.absen,
              skor: finalScorePercentage
            };

            // --- PERUBAHAN UNTUK VERCEL (Menggunakan Fetch API) ---
            if (GOOGLE_SCRIPT_URL !== "URL_WEB_APP_GAS_ANDA_DISINI") {
              fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                // Menggunakan text/plain agar tidak terkena blokir CORS Preflight dari browser
                headers: {
                  "Content-Type": "text/plain;charset=utf-8", 
                },
                body: JSON.stringify(payloadData),
              })
                .then((response) => response.json())
                .then((data) => {
                  if (data.status === "success") {
                    console.log("Skor berhasil disimpan di Google Sheets!");
                  } else {
                    console.error("Gagal menyimpan skor:", data.message);
                  }
                })
                .catch((error) => {
                  console.error("Error Fetch:", error);
                  alert("Gagal menyimpan skor. Pastikan koneksi internet Anda stabil.");
                });
            } else {
              console.warn("URL Google Script belum diisi! Data hanya disimulasikan.");
              console.log("Data Simulasi:", payloadData);
            }
            // --------------------------------------------------------

            setGameState('result');
          }
        }, 1500);
      };

      const resetQuiz = () => {
        setGameState('login');
        setUserData({ name: '', cls: '', absen: '' });
        setCurrentQuestionIdx(0);
        setScore(0);
        setSelectedOption(null);
        setFeedback(null);
      };

      const renderLogin = () => (
        <div className="flex-1 flex items-center justify-center p-4">
          <div className="w-full max-w-md bg-white dark:bg-gray-800 rounded-3xl shadow-2xl p-8 transform transition-all duration-300">
            <div className="text-center mb-8">
              <div className="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 mb-4">
                <BookIcon />
              </div>
              <h1 className="text-3xl font-bold text-gray-900 dark:text-white mb-2">PSAT Matematika</h1>
              <p className="text-gray-500 dark:text-gray-400 text-sm">Masuk untuk memulai ujian</p>
            </div>

            <form onSubmit={handleLoginSubmit} className="space-y-5">
              <div>
                <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Nama Lengkap</label>
                <div className="relative">
                  <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400"><UserIcon /></div>
                  <input type="text" required className="w-full pl-10 pr-4 py-3 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all outline-none text-gray-900 dark:text-white" placeholder="Masukkan nama lengkap" value={userData.name} onChange={(e) => setUserData({...userData, name: e.target.value})} />
                </div>
              </div>

              <div>
                <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Kelas</label>
                <div className="relative">
                  <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400"><BookIcon /></div>
                  <select required className="w-full pl-10 pr-4 py-3 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all outline-none text-gray-900 dark:text-white appearance-none" value={userData.cls} onChange={(e) => setUserData({...userData, cls: e.target.value})}>
                    <option value="" disabled>Pilih Kelas</option>
                    <option value="11-1">Kelas 11-1</option>
                    <option value="11-4">Kelas 11-4</option>
                    <option value="11-6">Kelas 11-6</option>
                  </select>
                </div>
              </div>

              <div>
                <label className="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Nomor Absen</label>
                <div className="relative">
                  <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400"><HashIcon /></div>
                  <input type="number" min="1" required className="w-full pl-10 pr-4 py-3 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all outline-none text-gray-900 dark:text-white" placeholder="Contoh: 15" value={userData.absen} onChange={(e) => setUserData({...userData, absen: e.target.value})} />
                </div>
              </div>

              <button type="submit" className="w-full py-3.5 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white rounded-xl font-medium text-lg shadow-lg shadow-blue-500/30 transform transition-all hover:-translate-y-0.5 mt-4">
                Mulai Ujian
              </button>
            </form>
          </div>
        </div>
      );

      const renderQuiz = () => {
        const question = questionsData[currentQuestionIdx];
        const progress = ((currentQuestionIdx) / questionsData.length) * 100;
        const optionLabels = ['A', 'B', 'C', 'D', 'E'];

        return (
          <div className="flex-1 flex flex-col w-full max-w-3xl mx-auto p-4 md:p-6 transition-all duration-500">
            <div className="flex justify-between items-end mb-4">
              <div><h2 className="text-xl font-bold text-gray-800 dark:text-white">Soal {currentQuestionIdx + 1} <span className="text-gray-400 text-sm font-normal">/ {questionsData.length}</span></h2></div>
              <div className="text-right"><p className="text-sm text-gray-500 dark:text-gray-400">{userData.name} • {userData.cls}</p></div>
            </div>

            <div className="w-full h-2 bg-gray-200 dark:bg-gray-700 rounded-full mb-8 overflow-hidden">
              <div className="h-full bg-blue-500 transition-all duration-500 ease-out" style={{ width: `${progress}%` }} />
            </div>

            <div className="bg-white dark:bg-gray-800 rounded-3xl shadow-xl p-6 md:p-8 mb-6 relative overflow-hidden">
              {feedback && (
                <div className={`absolute inset-0 z-10 flex flex-col items-center justify-center bg-white/90 dark:bg-gray-800/90 backdrop-blur-sm transition-opacity duration-300 ${feedback ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}>
                  {feedback === 'correct' ? (
                    <><div className="w-20 h-20 bg-green-100 dark:bg-green-900/40 rounded-full flex items-center justify-center mb-4 animate-bounce"><CheckCircle /></div><h3 className="text-2xl font-bold text-green-600 dark:text-green-400">Jawaban Benar!</h3></>
                  ) : (
                    <><div className="w-20 h-20 bg-red-100 dark:bg-red-900/40 rounded-full flex items-center justify-center mb-4 animate-pulse"><XCircle /></div><h3 className="text-2xl font-bold text-red-600 dark:text-red-400">Jawaban Salah</h3></>
                  )}
                </div>
              )}

              <div className="text-lg md:text-xl text-gray-800 dark:text-gray-100 mb-8 leading-relaxed font-medium">
                {question.question}
              </div>

              <div className="space-y-3">
                {question.options.map((opt, idx) => {
                  const isSelected = selectedOption === idx;
                  let btnClass = "w-full text-left p-4 rounded-xl border-2 transition-all duration-200 flex items-center group ";
                  if (isSelected) btnClass += "border-blue-500 bg-blue-50 dark:bg-blue-900/20 text-blue-700 dark:text-blue-300 shadow-md transform scale-[1.01]";
                  else btnClass += "border-gray-200 dark:border-gray-700 hover:border-blue-300 dark:hover:border-blue-600 hover:bg-gray-50 dark:hover:bg-gray-700/50 text-gray-700 dark:text-gray-300";

                  return (
                    <button key={idx} onClick={() => handleOptionSelect(idx)} disabled={feedback !== null} className={btnClass}>
                      <div className={`w-8 h-8 rounded-lg flex items-center justify-center mr-4 font-bold ${isSelected ? 'bg-blue-500 text-white' : 'bg-gray-100 dark:bg-gray-700 text-gray-500 dark:text-gray-400 group-hover:bg-blue-100 dark:group-hover:bg-blue-900/50 group-hover:text-blue-600'}`}>{optionLabels[idx]}</div>
                      <span className="text-lg flex-1">{opt}</span>
                    </button>
                  );
                })}
              </div>
            </div>

            <button onClick={handleConfirm} disabled={selectedOption === null || isConfirming} className={`w-full py-4 rounded-xl font-bold text-lg transition-all duration-300 ${selectedOption !== null && !isConfirming ? 'bg-blue-600 hover:bg-blue-700 text-white shadow-lg shadow-blue-500/30' : 'bg-gray-300 dark:bg-gray-700 text-gray-500 dark:text-gray-500 cursor-not-allowed'}`}>
              {isConfirming ? 'Memeriksa...' : 'Konfirmasi Jawaban'}
            </button>
          </div>
        );
      };

      const renderResult = () => {
        const finalScore = Math.round((score / questionsData.length) * 100);
        let message = "";
        let colorClass = "";

        if (finalScore >= 80) { message = "Luar Biasa!"; colorClass = "text-green-500 dark:text-green-400"; } 
        else if (finalScore >= 60) { message = "Cukup Baik!"; colorClass = "text-blue-500 dark:text-blue-400"; } 
        else { message = "Perlu Belajar Lagi!"; colorClass = "text-red-500 dark:text-red-400"; }

        return (
          <div className="flex-1 flex items-center justify-center p-4 w-full">
            <div className="w-full max-w-md bg-white dark:bg-gray-800 rounded-3xl shadow-2xl p-8 text-center transform transition-all duration-500 scale-100">
              <h2 className="text-2xl font-bold text-gray-800 dark:text-white mb-2">Hasil Ujian</h2>
              <p className="text-gray-500 dark:text-gray-400 mb-8">{userData.name} • {userData.cls} • Absen {userData.absen}</p>

              <div className="relative w-48 h-48 mx-auto mb-6">
                <svg className="w-full h-full" viewBox="0 0 36 36">
                  <path className="text-gray-200 dark:text-gray-700 stroke-current" strokeWidth="3" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                  <path className={`${colorClass.split(' ')[0]} stroke-current transition-all duration-1000 ease-out`} strokeWidth="3" strokeDasharray={`${finalScore}, 100`} strokeLinecap="round" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                </svg>
                <div className="absolute inset-0 flex flex-col items-center justify-center">
                  <span className={`text-5xl font-black ${colorClass}`}>{finalScore}</span>
                </div>
              </div>

              <h3 className={`text-2xl font-bold mb-2 ${colorClass}`}>{message}</h3>
              <p className="text-gray-600 dark:text-gray-300 mb-8">Kamu menjawab benar {score} dari {questionsData.length} soal.</p>

              <button onClick={resetQuiz} className="w-full py-3.5 px-4 bg-gray-900 dark:bg-white text-white dark:text-gray-900 hover:bg-gray-800 dark:hover:bg-gray-100 rounded-xl font-medium text-lg transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-900 dark:focus:ring-white">
                Selesai & Kembali
              </button>
            </div>
          </div>
        );
      };

      return (
        <div className={`min-h-screen flex flex-col font-sans transition-colors duration-300 ${isDarkMode ? 'dark' : ''}`}>
          <div className="fixed inset-0 z-0 overflow-hidden pointer-events-none">
            <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-blue-400/20 dark:bg-blue-900/20 blur-3xl"></div>
            <div className="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-indigo-400/20 dark:bg-indigo-900/20 blur-3xl"></div>
          </div>

          <nav className="relative z-10 p-4 flex justify-end">
            <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-3 rounded-full bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 shadow-sm hover:shadow-md transition-all focus:outline-none" title="Toggle Theme">
              {isDarkMode ? <SunIcon /> : <MoonIcon />}
            </button>
          </nav>

          <main className="relative z-10 flex-1 flex flex-col">
            {gameState === 'login' && renderLogin()}
            {gameState === 'quiz' && renderQuiz()}
            {gameState === 'result' && renderResult()}
          </main>

          <footer className="relative z-10 py-6 text-center mt-auto">
            <p className="text-gray-500 dark:text-gray-400 font-medium text-sm transition-colors">
              Dibuat oleh <span className="font-bold text-blue-600 dark:text-blue-400 tracking-wide hover:text-blue-700 dark:hover:text-blue-300 transition-colors cursor-default">Ryan wardiana</span>
            </p>
          </footer>
        </div>
      );
    }

    // Melakukan render aplikasi React ke dalam div#root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
